<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAME University — Unified MIS v12</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;
  color:#1a1a2e;background:#f0f2f7}

/* ── LOGIN ──────────────────────────────────────────────────── */
#sc-login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0d1f3c 0%,#1a3a6b 55%,#2d5fa3 100%)}
.lcard{
  background:#fff;border-radius:18px;padding:44px 38px;width:100%;max-width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,.4)}
.llogo{text-align:center;margin-bottom:28px}
.llogo img{width:200px;height:auto;display:block;margin:0 auto 8px}
.llogo .ls{font-size:12.5px;color:#6b7a99;margin-top:4px}
.llogo .lg{width:56px;height:3px;background:#c8922a;border-radius:2px;margin:10px auto 0}
.llogo .lt{font-size:22px;font-weight:800;color:#0d1f3c}
.lcard label{
  display:block;font-size:11px;font-weight:700;color:#6b7a99;
  text-transform:uppercase;letter-spacing:.07em;margin:14px 0 5px}
.lcard select{
  display:block;width:100%;padding:10px 13px;
  border:1.5px solid #d4dbe8;border-radius:8px;
  font-size:14px;color:#1a1a2e;background:#fff;
  outline:none;cursor:pointer;appearance:auto}
.lcard select:focus{border-color:#2d5fa3}
.pin-row{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 0 5px}
.pin-row label{margin:0}
.pin-toggle{font-size:11px;color:#2d5fa3;cursor:pointer;
  background:none;border:none;padding:0;font-family:inherit}
.pin-toggle:hover{text-decoration:underline}
#l-pin{
  display:block;width:100%;padding:10px 13px;
  border:1.5px solid #d4dbe8;border-radius:8px;
  font-size:14px;color:#1a1a2e;background:#fff;outline:none}
#l-pin:focus{border-color:#2d5fa3}
.btn-go{
  display:block;width:100%;margin-top:22px;padding:13px;
  background:#0d1f3c;color:#fff;border:none;border-radius:8px;
  font-size:15px;font-weight:700;cursor:pointer;transition:background .2s}
.btn-go:hover{background:#1a3a6b}
.adm-link{
  display:block;text-align:center;margin-top:14px;
  font-size:12px;color:#7a8db5;cursor:pointer;
  background:none;border:none;width:100%;font-family:inherit}
.adm-link:hover{color:#0d1f3c;text-decoration:underline}
.flash{padding:9px 13px;border-radius:7px;font-size:12.5px;margin-top:10px}
.flash.error{background:#fee2e2;color:#991b1b;display:block}
.flash.success{background:#dcfce7;color:#166534;display:block}
.flash.hidden{display:none}

/* ── FORM ────────────────────────────────────────────────────── */
#sc-form{display:flex;height:100vh;overflow:hidden}
.sidebar{width:280px;min-width:260px;background:#0d1f3c;
  display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.s-logo-wrap{padding:18px 18px 0;display:flex;align-items:center}
.s-logo-img{width:150px;height:auto;filter:brightness(0) invert(1)}
.s-logo-fb{color:#e8c46a;font-weight:700;font-size:14px}
.s-divider{height:1px;background:rgba(255,255,255,.15);margin:12px 18px 0}
.s-hdr{padding:0 0 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.s-name{font-size:13px;font-weight:700;color:#e8c46a;
  line-height:1.4;padding:10px 18px 3px}
.s-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;
  background:rgba(255,255,255,.14);color:#c8d5ec;margin:0 0 4px 18px}
.s-yr{font-size:11px;color:#7a8db5;padding:0 18px 8px}
.s-period{padding:10px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.slbl{font-size:10px;font-weight:700;color:#7a8db5;text-transform:uppercase;
  letter-spacing:.06em;display:block;margin-bottom:4px}
.ssel{width:100%;background:rgba(255,255,255,.1);color:#e2e8f0;
  border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:7px 9px;font-size:13px}
.ann-badge{background:rgba(200,164,42,.2);color:#e8c46a;border-radius:6px;
  padding:6px 10px;font-size:11.5px;font-weight:600;text-align:center}
.s-nav{flex:1;padding:10px 0;overflow-y:auto}
.s-nav-ttl{font-size:10px;font-weight:700;color:#7a8db5;text-transform:uppercase;
  letter-spacing:.06em;padding:7px 18px 3px}
#sec-nav{list-style:none}
.ni{padding:9px 18px;font-size:11.5px;color:#a0b0cc;cursor:pointer;
  border-left:3px solid transparent;transition:all .18s;line-height:1.4}
.ni:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.ni.active{background:rgba(255,255,255,.09);color:#e8c46a;border-left-color:#e8c46a}
.sr-b{display:inline-block;font-size:9.5px;font-weight:700;color:#e8c46a;
  background:rgba(200,164,42,.18);padding:1px 5px;border-radius:3px;
  margin-right:5px;white-space:nowrap}
.s-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);margin-top:auto}
.btn-out{width:100%;background:rgba(255,255,255,.07);color:#a0b0cc;
  border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:7px;
  font-size:12px;cursor:pointer}
.btn-out:hover{background:rgba(255,255,255,.12);color:#e2e8f0}
.f-content{flex:1;overflow-y:auto;background:#f0f2f7;padding:22px 26px}
.dupe-banner{background:#fff3cd;border:1px solid #f59e0b;border-radius:8px;
  padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:#856404}
.sc-card{background:#fff;border-radius:12px;padding:24px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:18px}
.sc-hdr{display:flex;align-items:center;gap:10px;margin-bottom:18px;
  padding-bottom:14px;border-bottom:2px solid #f0f3fa}
.sr-badge{background:#0d1f3c;color:#e8c46a;border-radius:5px;
  padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.sc-ttl{font-size:15px;font-weight:700;color:#0d1f3c;line-height:1.4}
.tbl-wrap{overflow-x:auto;margin-bottom:12px}
.dtbl{border-collapse:collapse;font-size:12px;min-width:100%}
.dtbl th{background:#e8f0fe;color:#1a3a6b;padding:8px 10px;font-size:11px;
  font-weight:700;white-space:nowrap;border:1px solid #d0dcf0;text-align:left}
.dtbl td{padding:6px 8px;border:1px solid #e8edf5}
.dtbl td input,.ci{width:100%;border:none;outline:none;font-size:12px;
  color:#1a1a2e;background:transparent;min-width:80px;padding:2px}
.dtbl td input:focus{background:#f0f6ff;border-radius:3px}
.rc-h{width:30px;text-align:center}
.rc{text-align:center;color:#6b7a99;font-size:11px}
.del-r{background:#fee2e2;color:#dc2626;border:none;border-radius:4px;
  padding:2px 7px;cursor:pointer;font-size:12px}
.del-r:hover{background:#fecaca}
.btn-add-row{margin-top:8px;padding:7px 16px;background:#e8f0fe;color:#1a3a6b;
  border:1px solid #c0d0f0;border-radius:6px;font-size:12.5px;cursor:pointer;font-weight:600}
.btn-add-row:hover{background:#d0e0fc}
.fixed-tbl .fix-lbl{font-size:12px;color:#4a5568;font-weight:500;padding:7px 10px}
.flds{display:flex;flex-direction:column;gap:14px}
.fg label,.flbl{display:block;font-size:11.5px;font-weight:600;color:#4a5568;margin-bottom:4px}
.fi{width:100%;padding:8px 10px;border:1.5px solid #d4dbe8;border-radius:6px;font-size:13px}
.fi:focus{outline:none;border-color:#2d5fa3}
.fta{width:100%;padding:8px 10px;border:1.5px solid #d4dbe8;border-radius:6px;
  font-size:13px;min-height:80px;resize:vertical}
.fsel{width:100%;padding:8px 10px;border:1.5px solid #d4dbe8;border-radius:6px;font-size:13px}
.ck-list{display:flex;flex-direction:column;gap:7px}
.ck-item{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;cursor:pointer}
.ck-item input[type=checkbox]{margin-top:2px;width:14px;height:14px;flex-shrink:0}
.up-zone{margin-top:16px;padding:14px;background:#f8faff;
  border:1.5px dashed #c0d0f0;border-radius:8px}
.up-lbl{font-size:11.5px;font-weight:600;color:#4a5568;margin-bottom:9px}
.up-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.up-inp{display:none}
.up-btn{padding:7px 14px;background:#e8f0fe;color:#1a3a6b;border:1px solid #c0d0f0;
  border-radius:6px;font-size:12px;cursor:pointer}
.btn-upload{padding:7px 14px;background:#0d1f3c;color:#fff;border:none;
  border-radius:6px;font-size:12px;cursor:pointer}
.btn-upload:hover{background:#1a3a6b}
.up-status{margin-top:8px;font-size:11.5px;color:#6b7a99;min-height:20px}
.up-chip{display:inline-flex;align-items:center;gap:4px;background:#e8f0fe;
  color:#1a3a6b;border-radius:4px;padding:2px 7px;font-size:11px;margin:2px}
.up-chip a{color:#1a3a6b;text-decoration:none}
.nav-btns{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;
  border-top:1px solid #f0f3fa}
.btn{display:inline-flex;align-items:center;justify-content:center;
  padding:10px 22px;border-radius:8px;font-size:13.5px;
  font-weight:600;cursor:pointer;border:none;transition:all .18s}
.btn-prev{background:#f0f3fa;color:#4a5568}
.btn-prev:hover{background:#e2e8f0}
.btn-nxt{background:#0d1f3c;color:#fff}
.btn-nxt:hover{background:#1a3a6b}
.btn-sub{background:#166534;color:#fff}
.btn-sub:hover{background:#14532d}
.done-card{text-align:center;padding:48px 24px}
.done-ico{font-size:56px;margin-bottom:16px}
.done-card h2{font-size:20px;color:#0d1f3c;margin-bottom:8px}
.done-card p{color:#6b7a99;margin-bottom:24px}
.f-msg{margin-top:14px}

/* ── ADMIN ────────────────────────────────────────────────────── */
#sc-admin{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.adm-bar{background:#0d1f3c;padding:12px 24px;display:flex;
  justify-content:space-between;align-items:center;flex-shrink:0}
.adm-left{display:flex;align-items:center;gap:16px}
.adm-logo{height:34px;display:block}
.adm-sep{width:1px;height:28px;background:rgba(255,255,255,.2)}
.adm-title{font-size:14px;font-weight:600;color:#e8c46a}
.adm-filters{background:#fff;padding:12px 24px;display:flex;
  gap:14px;align-items:center;border-bottom:1px solid #e2e8f0;flex-shrink:0;flex-wrap:wrap}
.adm-filters label{font-size:11px;font-weight:700;color:#6b7a99;text-transform:uppercase}
.adm-filters select{padding:6px 10px;border:1.5px solid #d4dbe8;border-radius:6px;font-size:13px}
.adm-body{flex:1;overflow-y:auto;padding:22px 24px}
.stats-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#fff;border-radius:10px;padding:16px 22px;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.06);min-width:100px}
.stat span{display:block;font-size:22px;font-weight:800;color:#0d1f3c}
.stat small{font-size:11px;color:#7a8db5;text-transform:uppercase;font-weight:600}
.a-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;
  overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:12.5px}
.a-table th{background:#0d1f3c;color:#e8c46a;padding:10px 14px;
  font-size:11px;font-weight:700;text-align:left}
.a-table td{padding:9px 14px;border-bottom:1px solid #f0f3fa}
.a-table tr:last-child td{border-bottom:none}
.a-table tr:hover td{background:#f8faff}
.badge{padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600}
.b-monthly{background:#dbeafe;color:#1e40af}
.b-annual{background:#dcfce7;color:#166534}
.btn-sm{padding:4px 10px;background:#e8f0fe;color:#1a3a6b;
  border:1px solid #c0d0f0;border-radius:5px;font-size:11.5px;cursor:pointer}
.no-d{color:#7a8db5;font-size:13px;padding:20px}

/* ── MODAL ────────────────────────────────────────────────────── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;z-index:1000}
.mod-box{background:#fff;border-radius:12px;width:90%;max-width:800px;
  max-height:85vh;display:flex;flex-direction:column}
.mod-hdr{padding:16px 20px;border-bottom:1px solid #f0f3fa;
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.mod-hdr h3{font-size:15px;font-weight:700}
.mod-cl{background:#f0f3fa;border:none;border-radius:6px;
  padding:5px 11px;cursor:pointer;font-size:15px;color:#5a6a8a}
#mod-body{padding:16px 20px;overflow-y:auto}
.det-hdr{font-size:13px;font-weight:700;color:#0d1f3c;
  padding-bottom:10px;border-bottom:2px solid #f0f3fa;margin-bottom:14px}
.det-ts{font-size:11px;font-weight:400;color:#7a8db5;margin-left:8px}
.det-sec{margin-bottom:14px;padding:12px;background:#f8faff;
  border-radius:7px;border-left:3px solid #0d1f3c}
.det-sec-ttl{font-size:10.5px;font-weight:700;color:#0d1f3c;
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.det-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.det-tbl th{background:#e8f0fe;color:#1a3a6b;padding:5px 8px;font-size:10.5px;font-weight:700;text-align:left}
.det-tbl td{padding:5px 8px;border-bottom:1px solid #f0f3fa}
.det-fields{display:flex;flex-direction:column;gap:5px}
.df{display:flex;gap:7px;font-size:11.5px;line-height:1.5}
.df-l{font-weight:600;color:#4a5568;min-width:130px;flex-shrink:0}
.det-files{margin-top:8px;font-size:11px;color:#3a5a8a}
.det-files a{color:#1a3a6b;margin-left:4px}

/* ══════════════════════════════════════════════════════
   FACULTY MASTER SHEET
══════════════════════════════════════════════════════ */
.fac-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin-bottom:16px;padding:12px 16px;background:#f8faff;
  border:1px solid #e2e8f0;border-radius:8px}
.fac-toolbar h3{font-size:14px;font-weight:700;color:#0d1f3c;flex:1}
.btn-fac-add{padding:8px 18px;background:#0d1f3c;color:#fff;border:none;
  border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.btn-fac-add:hover{background:#1a3a6b}
.fac-search{padding:7px 12px;border:1.5px solid #d4dbe8;border-radius:7px;
  font-size:13px;width:200px;outline:none}
.fac-stats{display:flex;gap:8px;font-size:11px;color:#6b7a99}
.fac-stat{background:#e8f0fe;color:#1a3a6b;padding:3px 9px;border-radius:10px;font-weight:600}

/* Faculty card grid */
.fac-grid{display:flex;flex-direction:column;gap:14px}
.fac-card{border:1.5px solid #e2e8f0;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.05)}
.fac-card-hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:#0d1f3c;cursor:pointer;user-select:none}
.fac-card-hdr:hover{background:#1a3a6b}
.fac-avatar{width:34px;height:34px;border-radius:50%;background:#c8922a;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.fac-card-name{font-size:13px;font-weight:700;color:#fff;flex:1}
.fac-card-desig{font-size:11px;color:#a0b0cc}
.fac-status-badge{padding:3px 10px;border-radius:10px;font-size:10.5px;font-weight:700;
  white-space:nowrap;flex-shrink:0}
.fac-status-badge.complete{background:#dcfce7;color:#166534}
.fac-status-badge.incomplete{background:#fef3c7;color:#92400e}
.fac-status-badge.invalid{background:#fee2e2;color:#991b1b}
.fac-card-del{background:rgba(255,255,255,.12);border:none;color:#a0b0cc;
  border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12px;margin-left:4px}
.fac-card-del:hover{background:rgba(239,68,68,.3);color:#fff}
.fac-card-body{display:none;padding:16px}

/* 4-section tabs */
.fac-tabs{display:flex;border-bottom:2px solid #e8edf5;margin-bottom:14px;gap:0}
.fac-tab{padding:7px 16px;font-size:12px;font-weight:600;color:#7a8db5;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.fac-tab.active{color:#0d1f3c;border-bottom-color:#0d1f3c}
.fac-tab:hover:not(.active){color:#0d1f3c}
.fac-tab-pane{display:none}
.fac-tab-pane.active{display:block}

/* Form fields inside faculty card */
.fac-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fac-fg{display:flex;flex-direction:column;gap:4px}
.fac-fg.full{grid-column:1/-1}
.fac-lbl{font-size:10.5px;font-weight:700;color:#6b7a99;text-transform:uppercase;
  letter-spacing:.05em;display:flex;align-items:center;gap:4px}
.fac-lbl .req{color:#dc2626;font-size:13px}
.fac-inp{padding:7px 10px;border:1.5px solid #d4dbe8;border-radius:6px;
  font-size:13px;color:#1a1a2e;outline:none;transition:border .2s;width:100%}
.fac-inp:focus{border-color:#2d5fa3}
.fac-inp.invalid{border-color:#dc2626;background:#fff5f5}
.fac-sel{padding:7px 10px;border:1.5px solid #d4dbe8;border-radius:6px;
  font-size:13px;color:#1a1a2e;width:100%;background:#fff}

/* File upload per field */
.fac-upload-group{display:flex;flex-direction:column;gap:5px}
.fac-upload-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fac-upload-btn{padding:5px 12px;background:#e8f0fe;color:#1a3a6b;border:1px solid #c0d0f0;
  border-radius:5px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.fac-upload-status{font-size:11px;color:#6b7a99}
.fac-upload-status.ok{color:#166534;font-weight:600}
.fac-upload-status.err{color:#dc2626;font-weight:600}
.fac-file-link{display:inline-flex;align-items:center;gap:4px;background:#dcfce7;
  color:#166534;border-radius:4px;padding:2px 8px;font-size:11px}
.fac-file-req{font-size:10px;color:#dc2626;font-style:italic}

/* Compliance section */
.fac-compliance{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;margin-top:12px;padding:12px;background:#f0f6ff;border-radius:8px;
  border:1px solid #c8d6ee}
.fac-comp-item{display:flex;flex-direction:column;gap:3px}
.fac-comp-lbl{font-size:10.5px;font-weight:700;color:#4a5568;text-transform:uppercase;letter-spacing:.04em}
.fac-comp-val{font-size:12px;font-weight:600}
.fac-comp-val.yes{color:#166534}
.fac-comp-val.no{color:#dc2626}
.fac-comp-val.na{color:#7a8db5}
.fac-eligible-row{grid-column:1/-1;display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:#fff;border-radius:6px;border:1.5px solid}
.fac-eligible-row.yes{border-color:#166534}
.fac-eligible-row.no{border-color:#dc2626}
.fac-eligible-lbl{font-size:12px;font-weight:700;flex:1}
.fac-eligible-frameworks{font-size:11px;color:#4a5568}

/* Audit trail */
.fac-audit{font-size:10.5px;color:#9ca3af;margin-top:10px;padding-top:8px;
  border-top:1px solid #f0f3fa;display:flex;gap:16px;flex-wrap:wrap}
.fac-audit span{display:inline-flex;align-items:center;gap:4px}

/* Empty state */
.fac-empty{text-align:center;padding:40px 20px;color:#9ca3af}
.fac-empty-icon{font-size:48px;margin-bottom:12px}
.fac-empty p{font-size:13px}

/* Duplicate warning */
.fac-dup-warn{background:#fff3cd;border:1.5px solid #f59e0b;border-radius:8px;
  padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#856404;display:none}

.btn-export{padding:7px 16px;background:#166534;color:#fff;border:none;
  border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.btn-export:hover{background:#14532d}
.export-progress{font-size:12px;color:#e8c46a;margin-left:12px;display:none}
[hidden]{display:none!important}

/* ── ADMIN TABS ─────────────────────────────────────────── */
.adm-tabs{display:flex;overflow-x:auto;background:#132040;flex-shrink:0;
  border-bottom:2px solid #0d1f3c;gap:0;padding:0 10px}
.adm-tabs::-webkit-scrollbar{height:4px}
.adm-tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.adm-tab{flex-shrink:0;padding:11px 16px;font-size:12px;font-weight:600;
  color:#8ca0be;background:none;border:none;border-bottom:3px solid transparent;
  cursor:pointer;transition:all .18s;white-space:nowrap;margin-bottom:-2px;
  font-family:inherit}
.adm-tab:hover{color:#e2e8f0;background:rgba(255,255,255,.05)}
.adm-tab.active{color:#e8c46a;border-bottom-color:#e8c46a;background:rgba(232,196,106,.07)}

/* ── TAB CONTENT PANELS ─────────────────────────────────── */
.tab-panel{padding:22px 24px;overflow-y:auto;flex:1}
.tp-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:10px}
.tp-title{font-size:17px;font-weight:800;color:#0d1f3c}
.tp-sub{font-size:12px;color:#7a8db5;margin-top:2px}
.tp-actions{display:flex;gap:10px;flex-wrap:wrap}

/* NAAC criterion cards */
.crit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px}
.crit-card{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.07);
  border-top:4px solid #0d1f3c;overflow:hidden}
.crit-card-hdr{padding:12px 16px;background:#f8faff;border-bottom:1px solid #e8edf5;
  display:flex;align-items:center;gap:10px}
.crit-num{background:#0d1f3c;color:#e8c46a;border-radius:6px;padding:3px 9px;
  font-size:11px;font-weight:800;white-space:nowrap}
.crit-title{font-size:12.5px;font-weight:700;color:#0d1f3c;line-height:1.4}
.crit-body{padding:12px 16px}
.crit-metric{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid #f0f3fa;font-size:12px}
.crit-metric:last-child{border-bottom:none}
.crit-metric-lbl{color:#4a5568;flex:1;padding-right:8px}
.crit-metric-val{font-weight:700;color:#0d1f3c;white-space:nowrap;background:#e8f0fe;
  padding:2px 8px;border-radius:4px;font-size:11.5px}
.crit-metric-val.green{background:#dcfce7;color:#166534}
.crit-metric-val.amber{background:#fef3c7;color:#92400e}
.crit-metric-val.red{background:#fee2e2;color:#991b1b}

/* NIRF parameter table */
.nirf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px}
.nirf-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nirf-card-lbl{font-size:10.5px;font-weight:700;color:#7a8db5;text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:6px}
.nirf-card-val{font-size:22px;font-weight:800;color:#0d1f3c;line-height:1.2}
.nirf-card-sub{font-size:11px;color:#9ca3af;margin-top:3px}

/* Compliance matrix */
.comp-matrix{width:100%;border-collapse:collapse;background:#fff;
  border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:12px}
.comp-matrix th{background:#0d1f3c;color:#e8c46a;padding:9px 12px;
  font-size:11px;font-weight:700;text-align:left;white-space:nowrap}
.comp-matrix td{padding:8px 12px;border-bottom:1px solid #f0f3fa}
.comp-matrix tr:last-child td{border-bottom:none}
.comp-matrix tr:hover td{background:#f8faff}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pill-green{background:#dcfce7;color:#166534}
.pill-amber{background:#fef3c7;color:#92400e}
.pill-red{background:#fee2e2;color:#991b1b}
.pill-grey{background:#f1f5f9;color:#64748b}

/* Analytics bars */
.bar-wrap{background:#fff;border-radius:10px;padding:16px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
.bar-lbl{font-size:12px;font-weight:600;color:#4a5568;margin-bottom:4px;display:flex;justify-content:space-between}
.bar-track{height:14px;background:#f0f3fa;border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;transition:width .6s ease;background:#0d1f3c}
.bar-fill.green{background:#166534}
.bar-fill.amber{background:#d97706}
.bar-fill.blue{background:#1e40af}

/* ISO status cards */
.iso-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.iso-card{background:#fff;border-radius:10px;padding:16px 18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid #0d1f3c}
.iso-card.compliant{border-left-color:#166534}
.iso-card.partial{border-left-color:#d97706}
.iso-card.pending{border-left-color:#dc2626}
.iso-card-title{font-size:13px;font-weight:700;color:#0d1f3c;margin-bottom:4px}
.iso-card-dept{font-size:11px;color:#7a8db5;margin-bottom:8px}
.iso-checklist{list-style:none;font-size:11.5px;display:flex;flex-direction:column;gap:3px}
.iso-checklist li::before{content:'✅ ';font-size:10px}
.iso-checklist li.no::before{content:'❌ ';font-size:10px}
.iso-checklist li.na::before{content:'— ';font-size:10px}

/* AISHE info boxes */
.aishe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.aishe-box{background:#fff;border-radius:10px;padding:14px 16px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
.aishe-val{font-size:26px;font-weight:800;color:#0d1f3c}
.aishe-lbl{font-size:11px;color:#7a8db5;text-transform:uppercase;font-weight:600;
  letter-spacing:.05em;margin-top:4px}

/* QS I-GAUGE */
.qs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.qs-card{background:#fff;border-radius:10px;padding:16px 18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06)}
.qs-param{font-size:11px;font-weight:700;color:#7a8db5;text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:6px}
.qs-val{font-size:20px;font-weight:800;color:#0d1f3c}
.qs-desc{font-size:11.5px;color:#6b7a99;margin-top:4px;line-height:1.4}

/* Accreditation status panel */
.accred-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:20px}
.accred-card{background:#fff;border-radius:10px;padding:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);border-top:4px solid #0d1f3c}
.accred-logo{font-size:28px;margin-bottom:8px}
.accred-name{font-size:14px;font-weight:800;color:#0d1f3c}
.accred-status{display:inline-block;margin-top:6px;padding:3px 10px;
  border-radius:10px;font-size:11px;font-weight:700}

/* Btn styles for tab actions */
.btn-pdf{padding:8px 18px;background:#991b1b;color:#fff;border:none;border-radius:7px;
  font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-pdf:hover{background:#7f1d1d}
.btn-pdf:disabled{opacity:.6;cursor:not-allowed}
.btn-refresh{padding:7px 14px;background:#e8f0fe;color:#1a3a6b;border:1px solid #c0d0f0;
  border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn-refresh:hover{background:#d0e0fc}

/* Year filter row in tabs */
.tab-filter-row{display:flex;gap:12px;align-items:center;margin-bottom:18px;
  background:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.05);flex-wrap:wrap}
.tab-filter-row label{font-size:11px;font-weight:700;color:#7a8db5;text-transform:uppercase}
.tab-filter-row select{padding:5px 10px;border:1.5px solid #d4dbe8;border-radius:6px;font-size:12.5px}
.tab-filter-row .tfy{margin-left:auto}
/* ── SOP Panel ─────────────────────────────── */
.sop-panel{margin-top:18px;border:1.5px solid #c8d6ee;border-radius:10px;overflow:hidden}
.sop-hdr{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#e8f0fe;
  cursor:pointer;user-select:none;font-size:13px;font-weight:700;color:#0d1f3c}
.sop-hdr:hover{background:#d8e8fe}
.sop-icon{font-size:16px}
.sop-toggle-icon{margin-left:auto;font-size:11px;color:#5a6a8a}
.sop-body{padding:12px 16px;display:none;background:#fafdff}
.sop-row{padding:10px 0;border-bottom:1px solid #e8edf5}
.sop-row:last-child{border-bottom:none}
.sop-metric-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.sop-num{background:#0d1f3c;color:#e8c46a;border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.sop-metric{font-size:12.5px;font-weight:600;color:#0d1f3c;flex:1;min-width:200px}
.sop-bench{display:inline-flex;align-items:center;gap:3px;background:#fef3c7;color:#92400e;
  border:1px solid #fcd34d;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.sop-app{display:inline-flex;align-items:center;background:#ede9fe;color:#5b21b6;
  border-radius:5px;padding:2px 7px;font-size:10.5px;font-weight:600;white-space:nowrap}
.sop-tl{display:inline-flex;align-items:center;background:#d1fae5;color:#065f46;
  border-radius:5px;padding:2px 7px;font-size:10.5px;font-weight:600;white-space:nowrap}
.sop-docs-lbl{font-size:11px;font-weight:700;color:#4a5568;margin-bottom:4px}
.sop-docs{margin:0 0 0 18px;padding:0}
.sop-docs li{font-size:11.5px;color:#374151;margin-bottom:3px;line-height:1.5}
.sop-scope{font-size:11.5px;color:#92400e;background:#fffbeb;border-left:3px solid #f59e0b;
  padding:6px 10px;border-radius:0 5px 5px 0;margin-top:6px;line-height:1.5}
</style>

const DUP_KEYS={
  'research papers': ['Title of Paper','ISSN Number'],
  'books and book':  ['Title of the Book Published','ISBN Number'],
  'patents':         ['Patent Number'],
  'seed money':      ['Name of the Faculty','Title of the Research Project'],
  'external research':['Title of the Research Project','Name of the Funding Agency'],
  'fdp attended':    ['Name of the Faculty','Title of Program'],
  'events conducted':['Name of the Event'],
  'workshop':        ['Event Title / Name of the Program','Date (From–To)'],
  'seminar':         ['Event Title / Name of the Program','Date (From–To)'],
  'training':        ['Training Title','Date'],
  'activities':      ['Activity Name','Date (DD/MM/YYYY)'],
  'faculty member':  ['Employee ID'],
  'list of psa':     ['Emp ID'],
  'special leave':   ['Employee ID','Leave Type (Maternity/Paternity/Other)'],
  'enrollment':      ['Enrolment ID'],
  'visiting':        ['Course Code','Faculty Name'],
  'elective':        ['Elective Course Code'],
  'phd awarded':     ['Name of the PhD Research Scholar'],
  'phd scholar':     ['Name of the Scholar'],
  'mou':             ['Name of the Organization with Whom MoU/Collaboration Being Signed'],
  'awards':          ['Name of the Student','Name of the Event'],
  'fire drill':      ['Date of Drill','Location / Block'],
  'alumni':          ['Name of the Alumni'],
};
function getDupKeys(sec){
  const t=sec.title.toLowerCase();
  // DUP_KEYS values are raw col names — apply san() to match stored row keys
  for(const [k,v] of Object.entries(DUP_KEYS)){
    if(t.includes(k))return v.map(c=>san(c));
  }
  return (sec.cols||[]).slice(0,2).map(c=>san(c));
}
function findDuplicate(sec,newRow){
  const rows=S.rows[sec.id]||[];
  if(!rows.length)return null;
  const keys=getDupKeys(sec);
  if(!keys.some(k=>String(newRow[k]||'').trim()))return null;
  for(let i=0;i<rows.length;i++){
    if(keys.every(k=>{
      const a=String(rows[i][k]||'').trim().toLowerCase();
      const b=String(newRow[k]||'').trim().toLowerCase();
      return a&&b&&a===b;
    }))return{rowNum:i+1,row:rows[i],keys};
  }
  return null;
}

/* ═══════════════ EVIDENCE VALIDATION ═══════════════ */
const EV_RULES={
  'mou':         {exts:['pdf'],note:'MoU must be PDF with seal & signature'},
  'patent':      {exts:['pdf'],note:'Patent evidence must be PDF'},
  'research paper':{exts:['pdf'],note:'Research papers must be PDF'},
  'book':        {exts:['pdf'],note:'Book/chapter evidence must be PDF'},
  'geo-tagged':  {exts:['jpg','jpeg','png'],note:'Geo-tagged evidence must be JPG/PNG'},
  'faculty':     {exts:['xlsx','xls','csv','pdf'],note:'Faculty data: Excel or PDF'},
  'psa':         {exts:['xlsx','xls','csv','pdf'],note:'PSA data: Excel or PDF'},
  'enrollment':  {exts:['xlsx','xls','csv','pdf'],note:'Enrollment data: Excel or PDF'},
  'financial':   {exts:['pdf','xlsx','xls'],note:'Financial records: PDF or Excel'},
  'fire drill':  {exts:['pdf','jpg','jpeg','png'],note:'Fire drill: PDF or photos'},
};
const ALLOWED_ANY=['pdf','xlsx','xls','csv','docx','doc','jpg','jpeg','png'];
const MAX_MB=10;
function validateFiles(files,sec){
  const t=(sec?sec.title:'').toLowerCase();
  let rule=null;
  for(const [k,r] of Object.entries(EV_RULES)){if(t.includes(k)){rule=r;break;}}
  const exts=rule?rule.exts:ALLOWED_ANY;
  const errs=[];
  for(const f of files){
    const ext=f.name.split('.').pop().toLowerCase();
    const mb=f.size/1048576;
    if(mb>MAX_MB)errs.push('"'+f.name+'" is '+mb.toFixed(1)+' MB — exceeds 10 MB limit');
    else if(!exts.includes(ext)){
      const note=rule?rule.note:'Accepted: '+ALLOWED_ANY.join(', ').toUpperCase();
      errs.push('"'+f.name+'" (.'+ext.toUpperCase()+') not accepted here.\n'+note);
    }
  }
  return errs;
}

function dbPath(d,y,p){return ROOT+'/'+san(d)+'/'+san(y)+'/'+san(p);}
function showScreen(name){
  ['sc-login','sc-form','sc-admin'].forEach(id=>{
    const el=$(id);
    if(el)el.hidden=(id!==name);
  });
}
function showMsg(id,msg,type){
  const el=$(id);
  if(!el)return;
  el.textContent=msg;
  el.className='flash '+type;
  el.hidden=false;
  setTimeout(()=>{el.hidden=true;},5000);
}

/* ═══════════════ LOGIN ═══════════════ */
function initLogin(){
  /* populate department dropdown — sorted alphabetically */
  const sel=$('l-dept');
  const sorted=[...DEPTS].sort((a,b)=>a.name.localeCompare(b.name));
  sorted.forEach(d=>{
    const opt=document.createElement('option');
    opt.value=d.id;
    opt.textContent=d.name;
    sel.appendChild(opt);
  });
  /* populate academic year dropdown */
  const ay=$('l-ay');
  AY.forEach(y=>{
    const opt=document.createElement('option');
    opt.value=y;
    opt.textContent=y;
    if(y==='2024-25')opt.selected=true;
    ay.appendChild(opt);
  });
  $('btn-login').onclick=doLogin;
  $('btn-adm').onclick=doAdminLogin;
  $('l-pin').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
}

function toggleSOP(hdr){
  const body=hdr.nextElementSibling;
  const icon=hdr.querySelector('.sop-toggle-icon');
  if(body.style.display==='none'||!body.style.display){
    body.style.display='block';
    if(icon)icon.textContent='▲';
  }else{
    body.style.display='none';
    if(icon)icon.textContent='▼';
  }
}
function togglePin(){
  const inp=$('l-pin');
  const lbl=$('pin-lbl');
  if(inp.type==='password'){
    inp.type='text';
    if(lbl)lbl.textContent='Hide';
  }else{
    inp.type='password';
    if(lbl)lbl.textContent='Show';
  }
}

function doLogin(){
  const deptId=$('l-dept').value;
  const yr=$('l-ay').value;
  const pin=$('l-pin').value.trim();
  if(!deptId){showMsg('l-msg','Please select a Department.','error');return;}
  if(!yr){showMsg('l-msg','Please select an Academic Year.','error');return;}
  if(!pin){showMsg('l-msg','Please enter the Department PIN.','error');return;}
  const dept=DEPTS.find(d=>d.id===deptId);
  if(!dept||dept.pin!==pin){
    showMsg('l-msg','Incorrect PIN. Please try again.','error');
    $('l-pin').value='';
    $('l-pin').focus();
    return;
  }
  S={dept:dept,admin:false,year:yr,month:'Apr',secIdx:0,rows:{},fvals:{},uploads:{}};
  showScreen('sc-form');
  renderForm();
}

function doAdminLogin(){
  const p=prompt('Enter Admin PIN:');
  if(!p)return;
  if(p.trim()===ADMIN_PIN){
    S.admin=true;
    showScreen('sc-admin');
    renderAdmin();
  }else{
    showMsg('l-msg','Invalid Admin PIN.','error');
  }
}

/* ═══════════════ FORM ═══════════════ */
function renderForm(){
  const d=S.dept;
  $('f-name').textContent=d.name;
  $('f-badge').textContent=d.type==='monthly'?'Monthly':'Annual';
  $('f-yr').textContent='AY '+S.year;
  const pw=$('f-period');
  if(d.type==='monthly'){
    let html='<span class="slbl">Month</span><select class="ssel" id="f-mon">';
    MONTHS.forEach(m=>{ html+='<option'+(m===S.month?' selected':'')+'>'+m+'</option>'; });
    html+='</select>';
    pw.innerHTML=html;
    $('f-mon').onchange=function(e){S.month=e.target.value;checkDupe();};
  }else{
    pw.innerHTML='<div class="ann-badge">Annual Submission</div>';
  }
  buildNav();
  renderSec(0);
  checkDupe();
  $('btn-logout').onclick=function(){
    showScreen('sc-login');
    $('l-pin').value='';
    $('l-pin').type='password';
    var lbl=$('pin-lbl');
    if(lbl)lbl.textContent='Show';
  };
}

function buildNav(){
  const ul=$('sec-nav');
  ul.innerHTML='';
  S.dept.sections.forEach(function(sec,i){
    const li=document.createElement('li');
    li.className='ni'+(i===S.secIdx?' active':'');
    li.innerHTML='<span class="sr-b">'+sec.sr+'</span>'+sec.title;
    li.onclick=(function(idx){return function(){saveCurrent();renderSec(idx);};})(i);
    ul.appendChild(li);
  });
}

function renderSec(idx){
  S.secIdx=idx;
  const sec=S.dept.sections[idx];

  /* ── Faculty Master Sheet mode ── */
  if(sec.mode==='faculty'){

function buildNavBtns(idx){
  const total=S.dept.sections.length;
  let h='<div class="nav-btns">';
  if(idx>0)h+='<button type="button" class="btn btn-prev" id="btn-prev">← Previous</button>';
  else h+='<span></span>';
  if(idx<total-1)h+='<button type="button" class="btn btn-nxt" id="btn-next">Next →</button>';
  else h+='<button type="button" class="btn btn-sub" id="btn-submit">✓ Submit All Sections</button>';
  h+='</div>';
  return h;
}
function wireBtns(idx){
  if($('btn-prev'))$('btn-prev').onclick=function(){saveCurrent();renderSec(idx-1);};
  if($('btn-next'))$('btn-next').onclick=function(){saveCurrent();renderSec(idx+1);};
  if($('btn-submit'))$('btn-submit').onclick=function(){saveCurrent();submitForm();};
}

function addRow(secId){
  saveCurrent();
  const sec=S.dept.sections.find(function(s){return s.id===secId;});
  if(!S.rows[secId])S.rows[secId]=[];
  /* read current last row for duplicate check */
  const tbody=document.getElementById('tb-'+secId);
  if(tbody){
    const trs=tbody.querySelectorAll('tr');
    if(trs.length>0){
      const lastRow={};
      trs[trs.length-1].querySelectorAll('input.ci').forEach(function(inp){
        lastRow[inp.dataset.key]=inp.value;
      });
      const dup=findDuplicate(sec,lastRow);
      if(dup){
        const preview=dup.keys.slice(0,2).map(function(k){
          return k.replace(/_/g,' ')+': "'+String(dup.row[k]||'').substring(0,40)+'"';
        }).join(', ');
        const ok=confirm(
          'DUPLICATE DETECTED\n\nA matching entry already exists at row '+dup.rowNum+':\n'+
          preview+'\n\nProceed anyway?'
        );
        if(!ok){S.rows[secId].pop();renderSec(S.secIdx);return;}
      }
    }
  }
  const r={};
  sec.cols.forEach(function(c){r[san(c)]='';});
  S.rows[secId].push(r);
  renderSec(S.secIdx);
}

function delRow(secId,ri){
  saveCurrent();
  if(!S.rows[secId])return;
  S.rows[secId].splice(ri,1);
  renderSec(S.secIdx);
}

function saveCurrent(){
  const sec=S.dept.sections[S.secIdx];
  if(sec.mode==='faculty'){
    S.rows[sec.id]=window.FAC[sec.id]||[];
    return;
  }
  if(sec.mode==='table'){
    const tbody=document.getElementById('tb-'+sec.id);
    if(!tbody)return;
    const rows=[];
    tbody.querySelectorAll('tr').forEach(function(tr){
      const row={};
      tr.querySelectorAll('input.ci').forEach(function(inp){row[inp.dataset.key]=inp.value;});
      if(Object.keys(row).length)rows.push(row);
    });
    S.rows[sec.id]=rows;
  }else if(sec.mode==='fixed'){
    const vals={};
    document.querySelectorAll('.fix-val').forEach(function(inp){vals[inp.dataset.key]=inp.value;});
    S.fvals[sec.id]=vals;
  }else{
    const vals={};
    (sec.fields||[]).forEach(function(f){
      if(f.type==='checklist'){
        const obj={};
        f.items.forEach(function(item){
          const el=document.getElementById('ff-'+sec.id+'-'+f.id+'-'+san(item));
          if(el)obj[san(item)]=el.checked;
        });
        vals[f.id]=obj;
      }else{
        const el=document.getElementById('ff-'+sec.id+'-'+f.id);
        if(el)vals[f.id]=el.value;
      }
    });
    S.fvals[sec.id]=vals;
  }
}

async function checkDupe(){
  const db=getDB();
  const banner=$('dupe-banner');
  if(!banner)return;
  if(!db){banner.hidden=true;return;}
  try{
    const d=S.dept;
    const period=d.type==='monthly'?S.month:'Annual';
    const snap=await db.ref(dbPath(d.id,S.year,period)).once('value');
    if(snap&&snap.exists()){
      const ts=(snap.val()||{}).__ts||'';
      banner.innerHTML='⚠️ A submission already exists for <strong>'+S.year+' – '+period+'</strong>'+(ts?' (saved '+ts+')':'')+'. Submitting again will <u>overwrite</u> it.';
      banner.hidden=false;
    }else{banner.hidden=true;}
  }catch(e){banner.hidden=true;}
}

async function submitForm(){
  saveCurrent();
  const d=S.dept;
  const period=d.type==='monthly'?S.month:'Annual';
  const payload={
    __dept:d.id,__name:d.name,__type:d.type,
    __year:S.year,__period:period,
    __ts:new Date().toLocaleString('en-IN'),
    rows:S.rows,form:S.fvals,uploads:S.uploads
  };
  const btn=$('btn-submit');
  if(btn){btn.disabled=true;btn.textContent='Submitting…';}
  const db=getDB();
  if(!db){
    showMsg('f-msg','Firebase unavailable — check internet connection.','error');
    if(btn){btn.disabled=false;btn.textContent='✓ Submit All Sections';}
    return;
  }
  try{
    await db.ref(dbPath(d.id,S.year,period)).set(payload);
    $('f-main').innerHTML=
      '<div class="done-card"><div class="done-ico">✅</div>'+
      '<h2>Submitted Successfully!</h2>'+
      '<p><strong>'+esc(d.name)+'</strong> — <strong>'+S.year+' / '+period+'</strong> saved.</p>'+
      '<button type="button" class="btn btn-nxt" onclick="location.reload()">New Submission</button></div>';
  }catch(e){
    showMsg('f-msg','Error: '+e.message,'error');
    if(btn){btn.disabled=false;btn.textContent='✓ Submit All Sections';}
  }
}

function uploadFiles(secId){
  const inp=document.getElementById('up-'+secId);
  if(!inp||!inp.files||!inp.files.length){alert('Please choose files first.');return;}
  const sec=S.dept?S.dept.sections.find(function(s){return s.id===secId;}):null;
  const errs=validateFiles(Array.from(inp.files),sec);
  if(errs.length){
    const go=confirm('EVIDENCE VALIDATION WARNING\n\n'+errs.join('\n\n')+'\n\nUpload anyway? (OK = Yes, Cancel = No)');
    if(!go)return;
  }
  const st=getST();
  const stEl=document.getElementById('up-st-'+secId);
  if(!st){if(stEl)stEl.textContent='Storage unavailable — check internet.';return;}
  if(stEl)stEl.textContent='Uploading…';
  if(!S.uploads[secId])S.uploads[secId]=[];
  const d=S.dept;
  const period=d.type==='monthly'?S.month:'Annual';
  let done=0;
  const total=inp.files.length;
  Array.from(inp.files).forEach(function(file){
    const path='flame_mis_files/'+d.id+'/'+S.year+'/'+period+'/'+secId+'/'+Date.now()+'_'+file.name;
    const ref=st.ref(path);
    const task=ref.put(file);
    task.on('state_changed',null,
      function(err){if(stEl)stEl.textContent='Upload error: '+err.message;},
      function(){
        ref.getDownloadURL().then(function(url){
          S.uploads[secId].push({name:file.name,url:url});
          done++;
          if(stEl){
            if(done<total){stEl.textContent='Uploaded '+done+'/'+total+'…';}
            else{
              var chips='';
              S.uploads[secId].forEach(function(f){
                chips+='<span class="up-chip">📄 '+esc(f.name)+' <a href="'+f.url+'" target="_blank">↗</a></span>';
              });
              stEl.innerHTML=chips;
            }
          }
        });
      }
    );
  });
  inp.value='';
}

/* ── Helpers ── */
function getSecRows(rows,deptName,secId){
  var out=[];
  rows.filter(function(r){return !deptName||r.dept===deptName;}).forEach(function(r){
    var sr=((r.raw.rows||{})[secId])||[];
    sr.forEach(function(row){var o=Object.assign({},row);o._year=r.year;o._period=r.period;out.push(o);});
  });
  return out;
}
function sumCol(rows,deptName,secId,colKey){
  return getSecRows(rows,deptName,secId).reduce(function(acc,r){return acc+(parseFloat(r[colKey])||0);},0);
}
function countRows(rows,deptName,secId){return getSecRows(rows,deptName,secId).length;}
function getFacultyStats(rows){
  var total=0,phd=0,fullTime=0,teaching=0;
  rows.filter(function(r){return r.dept==='HR Office';}).forEach(function(r){
    var fl=((r.raw.rows||{})['s1'])||[];
    fl.forEach(function(f){total++;if(f.hasPHD==='Yes')phd++;if(f.empType==='Full-Time')fullTime++;teaching+=parseFloat(f.teachExp)||0;});
  });
  return{total:total,phd:phd,fullTime:fullTime,avgTeachExp:total?Math.round(teaching/total*10)/10:0,phdPct:total?Math.round(phd/total*100):0};
}
function fdpLabel(rows){
  var cnt=0;
  rows.filter(function(r){return r.dept==='HR Office';}).forEach(function(r){
    var fl=((r.raw.rows||{})['s1'])||[];
    fl.forEach(function(f){if(f.fdpLast24&&f.fdpLast24.trim())cnt++;});
  });
  return cnt>0?cnt+' faculty with FDP records':'—';
}

function renderTabNAAC(rows,body){
  var fac=getFacultyStats(rows);
  var seedCnt=countRows(rows,'R&D Cell','s1');
  var fellowCnt=countRows(rows,'R&D Cell','s2');
  var extCnt=countRows(rows,'R&D Cell','s3');
  var patCnt=countRows(rows,'R&D Cell','s4');
  var pubCnt=countRows(rows,'R&D Cell','s5');
  var bookCnt=countRows(rows,'R&D Cell','s6');
  var mouCnt=countRows(rows,'R&D Cell','s7');
  var evCnt=countRows(rows,'R&D Cell','s8');
  var seedAmt=sumCol(rows,'R&D Cell','s1','sanctioned_amount__inr_in_lakhs__').toFixed(2);
  var extAmt=sumCol(rows,'R&D Cell','s3','amount__inr_').toFixed(0);
  var years=[...new Set(rows.map(function(r){return r.year;}))].sort();

/* ══════════════════════════════════════════════════════
   TAB 8 — ANALYTICS
══════════════════════════════════════════════════════ */
function renderTabAnalytics(rows,body){
  var depts=[...new Set(rows.map(function(r){return r.dept;}))].sort();
  var years=[...new Set(rows.map(function(r){return r.year;}))].sort();
  var byDept={},byYear={},byMonth={};
  var MORD=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
  rows.forEach(function(r){byDept[r.dept]=(byDept[r.dept]||0)+1;byYear[r.year]=(byYear[r.year]||0)+1;});
  rows.filter(function(r){return r.type==='monthly';}).forEach(function(r){byMonth[r.period]=(byMonth[r.period]||0)+1;});
  var maxD=Math.max.apply(null,Object.values(byDept).concat([1]));
  var maxY=Math.max.apply(null,Object.values(byYear).concat([1]));
  var maxM=Math.max.apply(null,Object.values(byMonth).concat([1]));

  function bar(lbl,val,pct,cls){
    return '<div style="margin-bottom:9px"><div class="bar-lbl"><span>'+esc(lbl)+'</span><span>'+val+'</span></div>'+
           '<div class="bar-track"><div class="bar-fill '+cls+'" style="width:'+pct+'%"></div></div></div>';
  }

  var h='<div class="tab-panel">';
  h+='<div class="tp-hdr"><div>';
  h+='<div class="tp-title">Analytics Dashboard</div>';
  h+='<div class="tp-sub">MIS Submission Statistics | '+rows.length+' total records</div></div>';
  h+='<div class="tp-actions"><button class="btn-refresh" onclick="renderAdmin()">↺ Refresh</button></div></div>';
  h+='<div class="stats-row">';
  [{v:rows.length,l:'Total'},{v:depts.length,l:'Departments'},{v:years.length,l:'Academic Years'},
   {v:rows.filter(function(r){return r.type==='monthly';}).length,l:'Monthly'},
   {v:rows.filter(function(r){return r.type==='annual';}).length,l:'Annual'}].forEach(function(s){
    h+='<div class="stat"><span>'+s.v+'</span><small>'+s.l+'</small></div>';
  });
  h+='</div>';
  h+='<div class="bar-wrap"><div class="sc-hdr" style="border:none;padding:0;margin-bottom:14px"><h2 class="sc-ttl">Submissions by Department</h2></div>';
  Object.entries(byDept).sort(function(a,b){return b[1]-a[1];}).forEach(function(kv){
    h+=bar(kv[0],kv[1],Math.round(kv[1]/maxD*100),'blue');
  });
  h+='</div>';
  h+='<div class="bar-wrap"><div class="sc-hdr" style="border:none;padding:0;margin-bottom:14px"><h2 class="sc-ttl">Submissions by Year</h2></div>';
  Object.entries(byYear).sort().forEach(function(kv){
    h+=bar(kv[0],kv[1],Math.round(kv[1]/maxY*100),'green');
  });
  h+='</div>';
  if(Object.keys(byMonth).length){
    h+='<div class="bar-wrap"><div class="sc-hdr" style="border:none;padding:0;margin-bottom:14px"><h2 class="sc-ttl">Monthly Submission Pattern</h2></div>';
    MORD.forEach(function(m){if(byMonth[m])h+=bar(m,byMonth[m],Math.round(byMonth[m]/maxM*100),'amber');});
    h+='</div>';
  }
  h+='</div>';
  body.innerHTML=h;
}

/* ══════════════════════════════════════════════════════
   TAB 10 — COMPLIANCE MATRIX
══════════════════════════════════════════════════════ */
function renderTabCompliance(rows,body){
  var MORD=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
  var years=[...new Set(rows.map(function(r){return r.year;}))].sort();
  var selYr=window._compYr||years[years.length-1]||'';
  var mDepts=DEPTS.filter(function(d){return d.type==='monthly';}).map(function(d){return d.name;});
  var aDepts=DEPTS.filter(function(d){return d.type==='annual';}).map(function(d){return d.name;});

  function submittedMonths(dept,yr){
    var s=new Set();
    rows.filter(function(r){return r.dept===dept&&r.year===yr&&r.type==='monthly';}).forEach(function(r){s.add(r.period);});
    return s;
  }
  function submittedAnnual(dept,yr){
    return rows.some(function(r){return r.dept===dept&&r.year===yr&&r.type==='annual';});
  }

  var h='<div class="tab-panel">';
  h+='<div class="tp-hdr"><div>';
  h+='<div class="tp-title">Compliance Report — Submission Status Matrix</div>';
  h+='<div class="tp-sub">Department-wise monthly & annual submission tracker</div></div>';
  h+='<div class="tp-actions">';
  if(years.length>1){
    h+='<select style="padding:5px 10px;border:1.5px solid #d4dbe8;border-radius:6px;font-size:12.5px" onchange="compYrChange(this.value)">';
    years.forEach(function(y){h+='<option value="'+y+'"'+(y===selYr?' selected':'')+'>'+y+'</option>';});
    h+='</select> ';
  }
  h+='<button class="btn-refresh" onclick="renderAdmin()">↺ Refresh</button></div></div>';

  h+='<div style="font-size:13px;font-weight:700;color:#0d1f3c;margin:0 0 12px">Monthly Depts — '+selYr+'</div>';
  h+='<div class="tbl-wrap" style="margin-bottom:20px"><table class="comp-matrix"><thead><tr><th>Department</th>';
  MORD.forEach(function(m){h+='<th>'+m+'</th>';});
  h+='<th>Score</th></tr></thead><tbody>';
  mDepts.forEach(function(dept){
    var sub=submittedMonths(dept,selYr);
    var score=sub.size;
    var pct=Math.round(score/12*100);
    h+='<tr><td><strong>'+esc(dept)+'</strong></td>';
    MORD.forEach(function(m){h+='<td style="text-align:center"><span class="pill '+(sub.has(m)?'pill-green':'pill-grey')+'">'+(sub.has(m)?'✓':'—')+'</span></td>';});
    h+='<td><span class="pill '+(pct>=75?'pill-green':pct>=40?'pill-amber':'pill-red')+'">'+score+'/12</span></td></tr>';
  });
  h+='</tbody></table></div>';

  h+='<div style="font-size:13px;font-weight:700;color:#0d1f3c;margin:0 0 12px">Annual Depts — '+selYr+'</div>';
  h+='<div class="tbl-wrap"><table class="comp-matrix"><thead><tr><th>Department</th><th>Annual Submission</th></tr></thead><tbody>';
  aDepts.forEach(function(dept){
    var ok=submittedAnnual(dept,selYr);
    h+='<tr><td><strong>'+esc(dept)+'</strong></td><td><span class="pill '+(ok?'pill-green':'pill-red')+'">'+(ok?'✅ Submitted':'❌ Pending')+'</span></td></tr>';
  });
  h+='</tbody></table></div></div>';
  body.innerHTML=h;
}

    /* Compliance */

    /* Status */
    _status:'incomplete'
  };

/* Compute status for a faculty record */
function getFacStatus(f){
  const mandatory = [f.empId, f.name, f.designation, f.email, f.doj, f.highestQual, f.apptLetterUrl];
  const hasAll = mandatory.every(v=>v&&v.trim());
  const phdOk = (f.hasPHD==='Yes') ? !!f.phdCertUrl : true;
  if(!hasAll || !phdOk) return 'incomplete';
  if(f.phdVerified==='No'||f.apptVerified==='No') return 'incomplete';
  return 'complete';
}

/* Eligible for reporting computation */
function getEligibility(f){
  const naac = f.phdVerified==='Yes' && f.apptVerified==='Yes';
  const nirf = f.apptVerified==='Yes' && f.expVerified==='Yes';
  const aacsb = naac && f.expVerified==='Yes';
  return {naac, nirf, aacsb, any: naac||nirf||aacsb};
}

/* Check duplicates within current list */
function checkFacDuplicate(secId, f, skipId){
  const list = window.FAC[secId]||[];
  return list.find(function(x){
    if(x._id===skipId) return false;
    const sameEmp = f.empId && x.empId && f.empId.trim()===x.empId.trim();
    const sameEmail = f.email && x.email && f.email.trim().toLowerCase()===x.email.trim().toLowerCase();
    const samePan = f.pan && x.pan && f.pan.trim().toUpperCase()===x.pan.trim().toUpperCase();
    return sameEmp||sameEmail||samePan;
  });
}

/* Validate a file before upload: PDF only, max 10 MB */
function validateFacFile(file, mandatory){
  if(!file) return mandatory?'File is required':null;
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext!=='pdf') return 'Only PDF files accepted. Received: .'+ext.toUpperCase();
  if(file.size > 10*1024*1024) return 'File too large ('+((file.size/1048576).toFixed(1))+' MB). Max 10 MB.';
  return null;
}

  html += '<span>✏️ Modified: '+esc(f._updatedAt||'—')+'</span>';
  html += '<span>👤 By: '+esc(f._createdBy||'HR Office')+'</span>';
  html += '</div>';
  html += '</div>'; /* end comp tab */

  html += '<div style="display:flex;justify-content:flex-end;margin-top:12px">';
  html += '<button type="button" onclick="saveFacRecord(\''+secId+'\',\''+f._id+'\')" style="padding:7px 18px;background:#166534;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer">💾 Save Record</button>';
  html += '</div>';
  html += '</div>'; /* end card-body */
  html += '</div>'; /* end fac-card */
  return html;
}

/* ── Helper: text/number/date field ── */
function facField(fid, key, lbl, type, val, req, hint){
  var id='ff-'+fid+'-'+key;
  var h='<div class="fac-fg">';
  h+='<label class="fac-lbl" for="'+id+'">'+esc(lbl);
  if(req) h+=' <span class="req">*</span>';
  h+='</label>';
  if(hint) h+='<span style="font-size:10px;color:#9ca3af;margin-top:-2px">'+esc(hint)+'</span>';
  h+='<input type="'+type+'" class="fac-inp" id="'+id+'" value="'+esc(val||'')+'" data-key="'+key+'" data-fid="'+fid+'">';
  h+='</div>';
  return h;
}

/* ── Helper: select field ── */
function facSelField(fid, key, lbl, val, opts, req, hint){
  var id='ff-'+fid+'-'+key;
  var h='<div class="fac-fg">';
  h+='<label class="fac-lbl" for="'+id+'">'+esc(lbl);
  if(req) h+=' <span class="req">*</span>';
  h+='</label>';
  if(hint) h+='<span style="font-size:10px;color:#9ca3af;margin-top:-2px">'+esc(hint)+'</span>';
  h+='<select class="fac-sel" id="'+id+'" data-key="'+key+'" data-fid="'+fid+'">';
  opts.forEach(function(o){h+='<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';});
  h+='</select></div>';
  return h;
}

/* ── Helper: file upload field ── */
function facFileUpload(fid, secId, fileKey, lbl, currentUrl, currentName, mandatory, note){
  var inputId='fup-'+fid+'-'+fileKey;
  var statusId='fup-st-'+fid+'-'+fileKey;
  var h='<div class="fac-upload-group" style="margin-bottom:12px">';
  h+='<label class="fac-lbl">'+esc(lbl);
  if(mandatory) h+=' <span class="req">*</span>';
  h+='</label>';
  if(note) h+='<span class="fac-file-req">'+esc(note)+'</span>';
  h+='<div class="fac-upload-row">';
  h+='<input type="file" id="'+inputId+'" accept=".pdf" style="display:none" data-fid="'+fid+'" data-key="'+fileKey+'" data-secid="'+secId+'">';
  h+='<label for="'+inputId+'" class="fac-upload-btn">📂 Choose PDF</label>';
  h+='<button type="button" class="btn-upload" style="font-size:12px;padding:5px 12px" onclick="uploadFacFile(\''+fid+'\',\''+fileKey+'\',\''+secId+'\')">⬆ Upload</button>';
  h+='</div>';
  h+='<div id="'+statusId+'" class="fac-upload-status">';
  if(currentUrl) h+='<a href="'+currentUrl+'" target="_blank" class="fac-file-link">✅ '+esc(currentName||'File uploaded')+'</a>';
  else h+=(mandatory?'<span style="color:#dc2626">⚠ Required — not yet uploaded</span>':'No file uploaded yet');
  h+='</div></div>';
  return h;
}

/* ── Helper: compliance toggle field ── */
function facCompField(fid, key, lbl, val, hint, metric, forceNa){
  var id='ff-'+fid+'-'+key;
  var displayVal = forceNa==='na' ? 'N/A' : (val==='Yes'?'Yes':'No');
  var cls = forceNa==='na' ? 'na' : (val==='Yes'?'yes':'no');
  var h='<div class="fac-comp-item">';
  h+='<div class="fac-comp-lbl">'+esc(lbl)+'</div>';
  h+='<div class="fac-comp-val '+cls+'">'+displayVal+'</div>';
  h+='<div style="font-size:10px;color:#9ca3af">'+esc(metric)+'</div>';
  if(forceNa!=='na'){
    h+='<select class="fac-sel" id="'+id+'" data-key="'+key+'" data-fid="'+fid+'" style="margin-top:4px;font-size:11px;padding:3px 6px">';
    h+='<option'+(val==='Yes'?' selected':'')+'>Yes</option>';
    h+='<option'+(val==='No'?' selected':'')+'>No</option>';
    h+='</select>';
    if(hint) h+='<span style="font-size:10px;color:#9ca3af">'+esc(hint)+'</span>';
  }
  h+='</div>';
  return h;
}

/* ── Add new faculty ── */
function addFaculty(secId){
  if(!window.FAC[secId]) window.FAC[secId]=[];
  const f = blankFaculty(window.FAC[secId].length);
  window.FAC[secId].push(f);
  reRenderFacSection(secId);
  /* Auto-expand the new card */
  setTimeout(function(){
    const body=document.getElementById('fac-body-'+f._id);
    if(body) body.style.display='block';
  },50);
}

/* ── Delete faculty ── */
function deleteFaculty(evt, secId, fid){
  evt.stopPropagation();
  if(!confirm('Delete this faculty record? This cannot be undone.')) return;
  window.FAC[secId]=(window.FAC[secId]||[]).filter(function(f){return f._id!==fid;});
  reRenderFacSection(secId);
}

/* ── Toggle card expand ── */
function toggleFacCard(fid){
  var body=document.getElementById('fac-body-'+fid);
  if(!body) return;
  body.style.display=(body.style.display==='block')?'none':'block';
}

/* ── Switch tab inside a card ── */
function switchFacTab(tabEl, paneId){
  var card=tabEl.closest('.fac-card-body');
  if(!card) return;
  card.querySelectorAll('.fac-tab').forEach(function(t){t.classList.remove('active');});
  card.querySelectorAll('.fac-tab-pane').forEach(function(p){p.classList.remove('active');});
  tabEl.classList.add('active');
  var pane=document.getElementById(paneId);
  if(pane) pane.classList.add('active');
}

/* ── Save faculty record — read all inputs back into store ── */
function saveFacRecord(secId, fid){
  const list=window.FAC[secId]||[];
  const f=list.find(function(x){return x._id===fid;});
  if(!f) return;
  /* Read all inputs/selects for this faculty */
  document.querySelectorAll('[data-fid="'+fid+'"]').forEach(function(el){
    var key=el.dataset.key;
    if(key) f[key]=el.value;
  });
  f._updatedAt=new Date().toLocaleString('en-IN');
  f._status=getFacStatus(f);
  /* Duplicate check */
  const dup=checkFacDuplicate(secId,f,fid);
  const warn=document.getElementById('fac-dup-'+secId);
  if(dup){
    if(warn){warn.style.display='block';warn.textContent='⚠️ Duplicate detected: '+esc(dup.name||dup.empId)+' already exists (matched on Employee ID / Email / PAN).';}
    if(!confirm('Duplicate record detected:\n"'+( dup.name||dup.empId)+'" already exists.\n\nSave anyway?')){return;}
  }else{if(warn)warn.style.display='none';}
  reRenderFacSection(secId);
  /* Re-expand this card */
  setTimeout(function(){
    var body=document.getElementById('fac-body-'+fid);
    if(body) body.style.display='block';
  },50);
}

/* ── Upload a file for a faculty field ── */
function uploadFacFile(fid, fileKey, secId){
  const inp=document.getElementById('fup-'+fid+'-'+fileKey);
  const statusEl=document.getElementById('fup-st-'+fid+'-'+fileKey);
  if(!inp||!inp.files||!inp.files.length){alert('Please choose a PDF file first.');return;}
  const file=inp.files[0];
  const err=validateFacFile(file,false);
  if(err){alert('❌ File Validation Failed:\n'+err);return;}
  const st=getST();
  if(!st){if(statusEl)statusEl.innerHTML='<span style="color:#dc2626">Storage unavailable — check internet</span>';return;}
  if(statusEl)statusEl.innerHTML='⏳ Uploading…';
  const d=S.dept;
  const period=d?d.type==='monthly'?S.month:'Annual':'General';
  const path='flame_mis_files/hr/faculty/'+fid+'/'+fileKey+'/'+Date.now()+'_'+file.name;
  const ref=st.ref(path);
  const task=ref.put(file);
  task.on('state_changed',null,
    function(err2){if(statusEl)statusEl.innerHTML='<span style="color:#dc2626">Upload error: '+err2.message+'</span>';},
    function(){
      ref.getDownloadURL().then(function(url){
        /* Store URL back into faculty record */
        const list=window.FAC[secId]||[];
        const f=list.find(function(x){return x._id===fid;});
        if(f){f[fileKey+'Url']=url;f[fileKey+'Name']=file.name;f._updatedAt=new Date().toLocaleString('en-IN');}
        if(statusEl)statusEl.innerHTML='<a href="'+url+'" target="_blank" class="fac-file-link">✅ '+esc(file.name)+'</a>';
        inp.value='';
      });
    }
  );
}

/* ── Filter faculty by search text ── */
function filterFac(secId){
  var q=(document.getElementById('fac-search-'+secId)||{}).value||'';
  q=q.toLowerCase().trim();
  (window.FAC[secId]||[]).forEach(function(f){
    var card=document.getElementById('fac-card-'+f._id);
    if(!card) return;
    var match=!q||(f.name||'').toLowerCase().includes(q)||(f.empId||'').toLowerCase().includes(q)||(f.dept||'').toLowerCase().includes(q)||(f.designation||'').toLowerCase().includes(q);
    card.style.display=match?'':'none';
  });
}

/* ── Re-render the faculty section in place ── */
function reRenderFacSection(secId){
  var wrap=document.getElementById('fac-wrap-'+secId);
  if(wrap) wrap.outerHTML=renderFacultySection(secId);
  else{
    var main=$('f-main');
    if(main) main.innerHTML=renderFacultySection(secId);
  }
}

function collectFacultyData(secId){
  return window.FAC[secId]||[];
}



/* ════════════════════════════════════════════════════════════════
   EXPORT TO EXCEL — Full Firebase data → XLSX
   Uses SheetJS (already loaded from CDN)
════════════════════════════════════════════════════════════════ */
async function exportToExcel(){
  const db=getDB();
  const btn=document.getElementById('btn-export-xl');
  const prog=document.getElementById('export-progress');
  if(!db){alert('Firebase not connected. Check internet connection.');return;}

  if(btn)btn.disabled=true;
  if(prog){prog.style.display='inline';prog.textContent='⏳ Fetching data…';}

  try{
    const snap=await db.ref(ROOT).once('value');
    if(!snap.exists()){
      alert('No submissions found in the database yet.');
      if(btn)btn.disabled=false;
      if(prog)prog.style.display='none';
      return;
    }

    if(prog)prog.textContent='⏳ Building workbook…';

    const wb=XLSX.utils.book_new();
    const allRows=[];     // for summary sheet
    const deptMap={};     // dept name → array of flat rows

    /* ── Walk the DB tree: ROOT/dept/year/period ── */
    snap.forEach(function(deptSnap){
      deptSnap.forEach(function(yearSnap){
        yearSnap.forEach(function(periodSnap){
          const v=periodSnap.val();
          if(!v||!v.__name) return;

          const deptName=v.__name||'Unknown';
          const year=v.__year||'';
          const period=v.__period||'';
          const ts=v.__ts||'';
          const type=v.__type||'';

          if(!deptMap[deptName]) deptMap[deptName]=[];

          /* Flatten table rows for each section */
          const rows=v.rows||{};
          const form=v.form||{};
          const uploads=v.uploads||{};

          /* Find dept config */
          const deptCfg=DEPTS.find(function(d){return d.name===deptName;});

          if(deptCfg){
            deptCfg.sections.forEach(function(sec){
              const secRows=rows[sec.id]||[];
              const secForm=form[sec.id]||{};
              const secUploads=uploads[sec.id]||[];

              if(sec.mode==='table'&&secRows.length){
                secRows.forEach(function(row){
                  const flat={
                    'Department':deptName,
                    'Academic Year':year,
                    'Period':period,
                    'Submission Type':type,
                    'Submitted At':ts,
                    'Section':sec.title,
                  };
                  /* Add each column value */
                  (sec.cols||[]).forEach(function(col){
                    flat[col]=row[san(col)]||'';
                  });
                  /* Add uploaded file links */
                  if(secUploads.length){
                    flat['Evidence Files']=secUploads.map(function(f){return f.name+': '+f.url;}).join(' | ');
                  }
                  deptMap[deptName].push(flat);
                  allRows.push(flat);
                });
              }else if(sec.mode==='faculty'){
                /* Faculty master sheet rows */
                secRows.forEach(function(fac){
                  const flat={
                    'Department':deptName,
                    'Academic Year':year,
                    'Period':period,
                    'Section':sec.title,
                    'Employee ID':fac.empId||'',
                    'Name':fac.name||'',
                    'Designation':fac.designation||'',
                    'Employment Type':fac.empType||'',
                    'Faculty/School':fac.school||'',
                    'Department':fac.dept||'',
                    'Date of Joining':fac.doj||'',
                    'Email':fac.email||'',
                    'PAN':fac.pan||'',
                    'Highest Qualification':fac.highestQual||'',
                    'PhD?':fac.hasPHD||'',
                    'Specialisation':fac.specialization||'',
                    'University':fac.univName||'',
                    'Nature of Appointment':fac.appointType||'',
                    'Date of Appointment':fac.dateAppt||'',
                    'Total Experience':fac.totalExp||'',
                    'Teaching Experience':fac.teachExp||'',
                    'Industry Experience':fac.indExp||'',
                    'PhD Verified':fac.phdVerified||'',
                    'Appt Verified':fac.apptVerified||'',
                    'Exp Verified':fac.expVerified||'',
                    'Status':fac._status||'',
                    'PhD Certificate':fac.phdCertUrl||'',
                    'Appointment Letter':fac.apptLetterUrl||'',
                    'Experience Certificate':fac.expCertUrl||'',
                    'Submitted At':ts,
                  };
                  deptMap[deptName].push(flat);
                  allRows.push(flat);
                });
              }else if(sec.mode==='form'||sec.mode==='fixed'){
                if(Object.keys(secForm).length){
                  const flat={
                    'Department':deptName,
                    'Academic Year':year,
                    'Period':period,
                    'Submission Type':type,
                    'Submitted At':ts,
                    'Section':sec.title,
                  };
                  Object.entries(secForm).forEach(function(kv){
                    flat[kv[0]]=typeof kv[1]==='object'?JSON.stringify(kv[1]):kv[1];
                  });
                  if(secUploads&&secUploads.length){
                    flat['Evidence Files']=secUploads.map(function(f){return f.name+': '+f.url;}).join(' | ');
                  }
                  deptMap[deptName].push(flat);
                  allRows.push(flat);
                }
              }
            });
          }
        });
      });
    });

    /* ── SUMMARY SHEET ── */
    const summaryData=[];
    summaryData.push(['FLAME University — Unified MIS Export']);
    summaryData.push(['Generated on',new Date().toLocaleString('en-IN')]);
    summaryData.push(['Total Submissions',allRows.length]);
    summaryData.push(['']);
    summaryData.push(['#','Department','Sections Submitted','Last Submitted']);

    const deptSummary={};
    allRows.forEach(function(r){
      const d=r['Department']||'Unknown';
      if(!deptSummary[d]){deptSummary[d]={count:0,ts:''};}
      deptSummary[d].count++;
      if(r['Submitted At']) deptSummary[d].ts=r['Submitted At'];
    });

    let si=1;
    Object.entries(deptSummary).sort(function(a,b){return a[0].localeCompare(b[0]);}).forEach(function(kv){
      summaryData.push([si++,kv[0],kv[1].count,kv[1].ts]);
    });

    const wsSummary=XLSX.utils.aoa_to_sheet(summaryData);
    wsSummary['!cols']=[{wch:4},{wch:40},{wch:20},{wch:25}];
    XLSX.utils.book_append_sheet(wb,wsSummary,'Summary');

    /* ── ALL DATA SHEET ── */
    if(allRows.length){
      const wsAll=XLSX.utils.json_to_sheet(allRows);
      wsAll['!cols']=Object.keys(allRows[0]).map(function(){return{wch:22};});
      XLSX.utils.book_append_sheet(wb,wsAll,'All Data');
    }

    /* ── ONE SHEET PER DEPARTMENT ── */
    if(prog)prog.textContent='⏳ Writing department sheets…';
    Object.entries(deptMap).sort(function(a,b){return a[0].localeCompare(b[0]);}).forEach(function(kv){
      const dName=kv[0];
      const dRows=kv[1];
      if(!dRows.length) return;
      /* Sheet name max 31 chars, no special chars */
      const sheetName=dName.replace(/[:\\\/\?\*\[\]]/g,'').substring(0,31);
      const ws=XLSX.utils.json_to_sheet(dRows);
      ws['!cols']=Object.keys(dRows[0]).map(function(){return{wch:22};});
      XLSX.utils.book_append_sheet(wb,ws,sheetName);
    });

    /* ── DOWNLOAD ── */
    if(prog)prog.textContent='⏳ Downloading…';
    const ay=$('af-yr')&&$('af-yr').value?$('af-yr').value:'All';
    const filename='FLAME_MIS_Export_'+ay+'_'+new Date().toLocaleDateString('en-IN').replace(/\//g,'-')+'.xlsx';
    XLSX.writeFile(wb,filename);

    if(prog){prog.textContent='✅ Downloaded!';setTimeout(function(){prog.style.display='none';},3000);}

  }catch(e){
    alert('Export error: '+e.message);
    if(prog)prog.style.display='none';
  }
  if(btn)btn.disabled=false;
}

</script>
